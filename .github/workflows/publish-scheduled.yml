name: Publicar entradas programadas

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publicar entradas pendientes
        env:
          POST_NOTIFY_WEBHOOK: ${{ secrets.POST_NOTIFY_WEBHOOK }}
          POST_NOTIFY_TOKEN: ${{ secrets.POST_NOTIFY_TOKEN }}
        run: node tools/publish-scheduled.mjs

      - name: Guardar cambios en el repositorio
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Publicar entradas programadas'
          file_pattern: 'posts/** entrada/** sitemap.xml'
