<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administración — El Manuscrito Zen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Zen+Kaku+Gothic+New:wght@300;400;500&family=Noto+Serif:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <main class="admin-page-container">
    <section class="admin-section">
      <div class="admin-card">
        <div class="admin-card-header">
          <div>
            <h3>Administración</h3>
            <p class="admin-subtitle">Acceso reservado para publicar entradas en la web.</p>
          </div>
        </div>

        <form class="admin-form" id="admin-login-form">
          <div class="form-control">
            <label for="admin-pass">Contraseña</label>
            <input type="password" id="admin-pass" placeholder="Tu clave de administración" autocomplete="current-password" required />
          </div>

          <div class="form-control">
            <label for="github-token">Token de GitHub</label>
            <input type="password" id="github-token" placeholder="ghp_… (solo se guarda en este navegador)" autocomplete="off" />
            <p class="admin-hint">
              Crea un token en GitHub con permiso de escritura en este repositorio.
              <a href="https://github.com/settings/tokens" target="_blank" rel="noopener">Configurar token</a>
            </p>
          </div>

          <button type="submit" class="btn-submit-post">Entrar al editor</button>
          <p class="admin-status" id="admin-status" hidden></p>
        </form>
      </div>
    </section>
  </main>

  <script src="admin-config.js"></script>
  <script src="admin-auth.js"></script>
  <script src="navbar.js"></script>
  <script>
    if (isAdminSession()) {
      window.location.href = 'publicar.html';
    }

    document.getElementById('admin-login-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const status = document.getElementById('admin-status');
      const password = document.getElementById('admin-pass').value;
      const token = document.getElementById('github-token').value;

      if (!loginAdmin(password)) {
        status.hidden = false;
        status.className = 'admin-status admin-status--error';
        status.textContent = 'Contraseña incorrecta.';
        return;
      }

      if (token.trim()) {
        saveGithubToken(token);
      }

      if (!hasGithubToken()) {
        status.hidden = false;
        status.className = 'admin-status admin-status--error';
        status.textContent = 'Necesitas un token de GitHub para publicar entradas.';
        sessionStorage.removeItem('zen_admin_session');
        return;
      }

      window.location.href = 'publicar.html';
    });
  </script>
</body>
</html>
