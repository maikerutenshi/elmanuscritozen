<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración — El Manuscrito Zen</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Estilos de emergencia para forzar visibilidad */
    .emergency-box {
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      margin-top: 50px !important;
    }
    input[type="password"] {
      display: block !important;
      visibility: visible !important;
      width: 100% !important;
      padding: 15px !important;
      border: 2px solid #000 !important;
      background: white !important;
      color: black !important;
      z-index: 9999 !important;
    }
  </style>
</head>
<body>

  <!-- El Navbar se inyecta vía navbar.js -->

  <main style="padding: 100px 20px; max-width: 400px; margin: 0 auto; text-align: center;">
    
    <div id="login-section" class="emergency-box">
      <h2>Acceso restringido</h2>
      
      <input type="password" id="admin-pass" placeholder="Introduce tu contraseña">
      
      <button onclick="checkPass()" style="margin-top: 20px; padding: 10px 20px;">Ingresar</button>
    </div>

  </main>

  <script>
    function checkPass() {
      const pass = document.getElementById('admin-pass').value;
      if (pass === "TU_CONTRASEÑA") { 
        window.location.href = "publicar.html";
      } else {
        alert("Contraseña incorrecta");
      }
    }
  </script>
  <script src="navbar.js"></script>
</body>
</html>
