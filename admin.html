<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración — El Manuscrito Zen</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="hero" id="hero">
    <div class="hero-bg">
      <img src="Fondo_inicio.png" alt="Jardín zen" class="hero-img">
      <div class="hero-overlay"></div>
    </div>
    <div class="hero-content">
      <h1 style="font-family: 'Zen Kaku Gothic New', sans-serif; font-size: clamp(2rem, 5vw, 3rem);">Administración</h1>
    </div>
  </header>

  <main class="main-content" style="padding: 100px 20px; max-width: 400px; margin: 0 auto; text-align: center;">
    
    <div id="login-section">
      <h2 style="font-family: 'Zen Kaku Gothic New', sans-serif; margin-bottom: 20px;">Acceso restringido</h2>
      
      <input type="password" id="admin-pass" placeholder="Introduce tu contraseña" 
             style="display: block !important; width: 100%; padding: 15px; border: 2px solid #000 !important; background: #fff !important; color: #000 !important; border-radius: 8px; margin-bottom: 20px; font-size: 16px;">
      
      <button onclick="checkPass()" class="btn-submit-post">Ingresar</button>
    </div>

  </main>

  <script>
    function checkPass() {
      const pass = document.getElementById('admin-pass').value;
      if (pass === "TU_CONTRASEÑA") { // Cambia esto por tu contraseña
        window.location.href = "publicar.html";
      } else {
        alert("Contraseña incorrecta");
      }
    }
  </script>
  <script src="navbar.js"></script>
</body>
</html>
