<html lang="es">
<head>

  <title>Administración — El Manuscrito Zen</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Zen+Kaku+Gothic+New:wght@300;400;500&family=Noto+Serif:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet" />

</head>
<body>
  <main class="admin-page-container">
    <section class="admin-section">
      <div class="admin-card">
        <div class="admin-card-header">
          <div>
            <h3>Administración</h3>
            <p class="admin-subtitle">Acceso con token de GitHub (solo en tu navegador).</p>
          </div>
        </div>

        <form class="admin-form" id="admin-login-form">
          <div class="form-control" id="token-field-wrap">
            <label for="github-token">Token de GitHub</label>
            <input type="password" id="github-token" placeholder="ghp_… o github_pat_…" autocomplete="off" required />
            <p class="admin-hint" id="token-hint">
              Token con permiso de escritura en el repositorio del sitio.
              <a href="https://github.com/settings/tokens" target="_blank" rel="noopener">Crear token en GitHub</a>
            </p>
          </div>

          <p class="admin-hint admin-hint--saved" id="token-saved-note" hidden>
            Token guardado en este equipo.
            <button type="button" class="btn-link" id="btn-change-token">Cambiar token</button>
          </p>

          <button type="submit" class="btn-submit-post" id="btn-enter">Entrar al editor</button>
          <p class="admin-status" id="admin-status" hidden></p>
        </form>
      </div>
    </section>
  </main>

  <script src="admin-config.js?v=3"></script>
  <script src="admin-auth.js?v=3"></script>
  <script>
    const tokenWrap = document.getElementById('token-field-wrap');
    const tokenSavedNote = document.getElementById('token-saved-note');
    const tokenInput = document.getElementById('github-token');
    const status = document.getElementById('admin-status');
    const form = document.getElementById('admin-login-form');
    const submitBtn = document.getElementById('btn-enter');

    function showStatus(message, isError) {
      status.hidden = false;
      status.className = 'admin-status' + (isError ? ' admin-status--error' : ' admin-status--ok');
      status.textContent = message;
    }

    function showTokenField() {
      tokenWrap.hidden = false;
      tokenSavedNote.hidden = true;
      tokenInput.required = true;
      tokenInput.value = '';
      tokenInput.focus();
    }

    function hideTokenFieldIfSaved() {
      if (hasGithubToken()) {
        tokenWrap.hidden = true;
        tokenSavedNote.hidden = false;
        tokenInput.required = false;
      }
    }

    document.getElementById('btn-change-token').addEventListener('click', () => {
      clearGithubToken();
      showTokenField();
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      submitBtn.disabled = true;

      try {
        const token = hasGithubToken() && tokenWrap.hidden
          ? getGithubToken()
          : tokenInput.value;

        showStatus('Comprobando token…', false);
        const result = await verifyGithubToken(token);

        if (!result.ok) {
          showStatus(result.error, true);
          showTokenField();
          return;
        }

        window.location.href = 'publicar.html';
      } catch (err) {
        showStatus('No se pudo conectar con GitHub.', true);
      } finally {
        submitBtn.disabled = false;
      }
    });

    (async () => {
      if (!hasGithubToken()) return;
      hideTokenFieldIfSaved();
      showStatus('Comprobando sesión…', false);
      if (await verifyStoredToken()) {
        window.location.href = 'publicar.html';
      } else {
        showStatus('El token guardado ya no es válido. Pega uno nuevo.', true);
        showTokenField();
      }
    })();
  </script>
</body>
</html>
