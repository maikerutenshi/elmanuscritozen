<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editor Zen</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div style="max-width: 800px; margin: 100px auto; padding: 20px;">
    <h1>Publicar nueva entrada</h1>
    
    <label>Título:</label>
    <input type="text" id="post-title" style="width: 100%; margin-bottom: 20px; padding: 10px;">
    
    <label>URL de la imagen (Flickr/Tumblr):</label>
    <input type="text" id="post-cover" placeholder="Pega aquí el enlace de tu foto" style="width: 100%; margin-bottom: 20px; padding: 10px;">
    
    <label>Contenido:</label>
    <textarea id="post-content" style="width: 100%; height: 300px; padding: 10px;"></textarea>
    
    <button onclick="guardarPost()" style="width: 100%; padding: 15px; margin-top: 20px;">Publicar ahora</button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
