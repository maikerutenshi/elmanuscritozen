<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publicar — El Manuscrito Zen</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="main-content" style="padding: 60px 20px; max-width: 600px; margin: 0 auto;">
    <h1 style="font-family: 'Zen Kaku Gothic New', sans-serif;">Crear nueva entrada</h1>
    <form id="post-form">
      <div class="form-control">
        <label>Título</label>
        <input type="text" name="title" required>
      </div>
      <div class="form-control">
        <label>Contenido</label>
        <textarea name="content" rows="10" required></textarea>
      </div>
      <button type="submit" class="btn-submit-post">Publicar entrada</button>
    </form>
  </main>

  <script src="navbar.js"></script>
</body>
</html>
