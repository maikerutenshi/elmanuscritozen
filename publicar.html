<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor — El Manuscrito Zen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Zen+Kaku+Gothic+New:wght@300;400;500&family=Noto+Serif:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="hero" id="hero">
    <div class="hero-bg">
      <img src="Fondo_inicio.png" alt="Jardín zen" class="hero-img">
      <div class="hero-overlay"></div>
    </div>
    
    <!-- He subido el contenido eliminando el margin-bottom grande y dando más espacio al textarea -->
    <div class="hero-content" style="padding-top: 50px;">
      <h1 style="font-family: 'Zen Kaku Gothic New', sans-serif; font-size: clamp(1.5rem, 4vw, 2.5rem); margin-bottom: 1.5rem;">Panel de Editor</h1>

      <form class="admin-form" id="post-editor-form" style="width: 100%; max-width: 600px; margin: 0 auto; text-align: left;">
        <div class="form-control" style="margin-bottom: 15px;">
          <label>Título</label>
          <input type="text" name="title" required>
        </div>
        
        <div class="form-control" style="margin-bottom: 15px;">
          <label>Imagen destacada</label>
          <input type="file" name="image" accept="image/*">
        </div>

        <div class="form-control" style="margin-bottom: 15px;">
          <label>Contenido</label>
          <!-- TextArea mucho más grande -->
          <textarea name="content" rows="15" required style="height: 300px;"></textarea>
        </div>

        <div style="display: flex; gap: 15px; margin-top: 10px;">
          <button type="submit" class="btn-submit-post" style="flex: 2;">Publicar nueva</button>
          <!-- Enlace hacia la página de gestión de entradas antiguas -->
          <a href="gestor.html" class="btn-submit-post" style="flex: 1; background: #b38f4e; text-align: center; padding-top: 12px;">Editar antiguas</a>
        </div>
      </form>
    </div>
  </header>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-logo">
        <span class="footer-symbol"><img src="enso.png" alt="Ensō" class="enso-img" /></span>
        <span class="footer-name">El Manuscrito Zen</span>
      </div>
      <p class="footer-phrase">"Respira. Estás aquí."</p>
      <p class="footer-copy">© 2026 El Manuscrito Zen · Hecho con presencia</p>
    </div>
  </footer>

  <script src="navbar.js"></script>
</body>
</html>
