<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Dojo — El Manuscrito Zen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Zen+Kaku+Gothic+New:wght@300;400;500&family=Noto+Serif:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="hero" id="hero">
    <div class="hero-bg">
      <img src="Fondo_inicio.png" alt="Jardín zen al amanecer" class="hero-img">
      <div class="hero-overlay"></div>
    </div>
    
    <div class="hero-content">
      <h1 style="font-family: 'Zen Kaku Gothic New', sans-serif; font-size: clamp(2rem, 5vw, 3rem); font-weight: 400; margin-bottom: 0.5rem;">Ingresar al Dojo</h1>
      <p style="font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 1rem; margin-bottom: 2rem; opacity: 0.9;">
        Ingresa al Dojo para recibir nuevas entradas en tu correo electrónico.
      </p>

      <form class="admin-form" id="dojo-enroll-form" style="width: 100%; max-width: 350px; margin: 0 auto;">
        <div class="form-control">
          <label>Tu nombre</label>
          <input type="text" name="name" required>
        </div>
        <div class="form-control">
          <label>Correo electrónico</label>
          <input type="email" name="email" required>
        </div>
        <button type="submit" class="btn-submit-post">Unirse a la práctica</button>
      </form>
    </div>
  </header>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-logo">
        <span class="footer-symbol"><img src="enso.png" alt="Ensō" class="enso-img" /></span>
        <span class="footer-name">El Manuscrito Zen</span>
      </div>
      <p class="footer-phrase">"Respira. Estás aquí."</p>
      <p class="footer-copy">© 2026 El Manuscrito Zen · Hecho con presencia</p>
    </div>
  </footer>

  <script src="navbar.js"></script>
  <script>
    const form = document.getElementById('dojo-enroll-form');
    const WEBHOOK_URL = 'https://maikiclaude.app.n8n.cloud/webhook/cfae8b17-239e-4531-ba3c-f1bf7e152dcc';

    form.addEventListener('submit', async (e) => {
      e.preventDefault(); 
      
      const formData = new FormData(form);
      const data = Object.fromEntries(formData);
      
      try {
        const response = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        
        if(response.ok) {
          alert('¡Gracias por unirte al Dojo!');
          form.reset();
        } else {
          alert('Hubo un error al enviar. Inténtalo de nuevo.');
        }
      } catch (error) {
        console.error('Error al enviar:', error);
        alert('Hubo un problema de conexión.');
      }
    });
  </script>
</body>
</html>
