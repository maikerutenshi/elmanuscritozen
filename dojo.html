<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Dojo — El Manuscrito Zen</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="hero">
    <div class="hero-bg"><img src="hero.jpg" alt="Fondo Zen" class="hero-img"></div>
    <div class="hero-overlay"></div>
    <div class="hero-content" style="max-width: 500px; width: 100%; padding: 0 20px;">
      <div style="background: rgba(255, 255, 255, 0.92); padding: 40px; border-radius: var(--radius-md);">
        <h1 style="font-family: var(--font-body); font-size: 32px; margin-bottom: 20px;">Ingresar al Dojo</h1>
        <form class="admin-form" id="dojo-enroll-form">
          <div class="form-control"><label>Tu nombre</label><input type="text" name="name" required></div>
          <div class="form-control"><label>Correo electrónico</label><input type="email" name="email" required></div>
          <button type="submit" class="btn-submit-post">Unirse a la práctica</button>
        </form>
      </div>
    </div>
  </main>

  <script src="navbar.js"></script>
</body>
</html>
