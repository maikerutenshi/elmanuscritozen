<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Google tag (gtag.js) - GA4 ManuscritoZenWeb -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6X3J9MSSP4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-6X3J9MSSP4');
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f0e8">
  <title>El Dojo — El Manuscrito Zen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Zen+Kaku+Gothic+New:wght@300;400;500&family=Noto+Serif:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=8" />
</head>
<body>
  <header class="hero" id="hero">
    <div class="hero-bg">
      <img src="Fondo_inicio.png" alt="Jardín zen al amanecer" class="hero-img">
      <div class="hero-overlay"></div>
    </div>
    
    <div class="hero-content">
      <h1 style="font-family: 'Zen Kaku Gothic New', sans-serif; font-size: clamp(2rem, 5vw, 3rem); font-weight: 400; margin-bottom: 0.5rem;">Ingresar al Dojo</h1>
      <p style="font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 1rem; margin-bottom: 2rem; opacity: 0.9;">
        Ingresa al Dojo para recibir nuevas entradas en tu correo electrónico.
      </p>

      <form class="admin-form" id="dojo-enroll-form" style="width: 100%; max-width: 350px; margin: 0 auto;">
        <div class="form-control">
          <label>Tu nombre</label>
          <input type="text" name="name" required>
        </div>
        <div class="form-control">
          <label>Correo electrónico</label>
          <input type="email" name="email" required>
        </div>
        <button type="submit" class="btn-submit-post">Unirse a la práctica</button>
      </form>
    </div>
  </header>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-logo">
        <span class="footer-symbol"><img src="enso.png" alt="Ensō" class="enso-img" /></span>
        <span class="footer-name">El Manuscrito Zen</span>
      </div>
      <p class="footer-phrase">"Respira. Estás aquí."</p>
      <p class="footer-copy">© 2026 El Manuscrito Zen · Hecho con presencia</p>
    </div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="comments-config.js"></script>
  <script src="navbar.js"></script>
  <script>
    const DOJO_MAKE_WEBHOOK = 'https://hook.eu1.make.com/0wvxlr955g74hugigubcbvff5le1xq32';
    const DOJO_MAKE_WEBHOOK_TOKEN = 'emz-dojo-wh-7f3k9m2p4x8q1n6';

    function initDojoFirebase() {
      if (!firebase.apps.length) {
        firebase.initializeApp({
          apiKey: COMMENTS_FIREBASE.apiKey,
          authDomain: COMMENTS_FIREBASE.authDomain,
          projectId: COMMENTS_FIREBASE.projectId,
          storageBucket: COMMENTS_FIREBASE.storageBucket,
          messagingSenderId: COMMENTS_FIREBASE.messagingSenderId,
          appId: COMMENTS_FIREBASE.appId,
        });
      }
    }

    const form = document.getElementById('dojo-enroll-form');
    const submitBtn = form.querySelector('button[type="submit"]');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = form.name.value.trim();
      const email = form.email.value.trim().toLowerCase();
      if (!name || !email) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Enviando…';

      try {
        initDojoFirebase();
        await firebase.firestore().collection('dojo_subscribers').add({
          name,
          email,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
        fetch(DOJO_MAKE_WEBHOOK, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, token: DOJO_MAKE_WEBHOOK_TOKEN }),
        }).catch((err) => console.warn('Dojo email webhook:', err));
        alert('¡Gracias por unirte al Dojo! Revisa tu correo en unos minutos (también la carpeta spam).');
        form.reset();
      } catch (error) {
        console.error('Dojo subscribe:', error);
        alert('No se pudo completar la suscripción. Inténtalo más tarde.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Unirse a la práctica';
      }
    });
  </script>
</body>
</html>
