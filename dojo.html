<body>
  <header class="hero" id="hero">
    <div class="hero-bg">
      <img src="Fondo_inicio.png" alt="Jardín zen al amanecer" class="hero-img">
      <div class="hero-overlay"></div>
    </div>
    
    <div class="hero-content">
      <h1 style="font-family: 'Zen Kaku Gothic New', sans-serif; font-size: clamp(2rem, 5vw, 3rem); font-weight: 400; margin-bottom: 0.5rem;">Ingresar al Dojo</h1>
      <p style="font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 1rem; margin-bottom: 2rem; opacity: 0.9;">
        Un mismo registro: recibes nuevas entradas por correo y puedes comentar en el blog.
      </p>

      <form class="admin-form" id="dojo-enroll-form" style="width: 100%; max-width: 350px; margin: 0 auto;">
        <div class="form-control">
          <label for="dojo-name">Tu nombre</label>
          <input type="text" id="dojo-name" name="name" required maxlength="80" autocomplete="name">
        </div>
        <div class="form-control">
          <label for="dojo-email">Correo electrónico</label>
          <input type="email" id="dojo-email" name="email" required autocomplete="email">
        </div>
        <div class="form-control">
          <label for="dojo-password">Contraseña (para comentar)</label>
          <input type="password" id="dojo-password" name="password" required minlength="6" autocomplete="new-password">
        </div>
        <div class="form-control dojo-consent-control">
          <label class="dojo-consent-label">
            <input type="checkbox" id="dojo-marketing-consent" name="marketingConsent" required>
            <span class="dojo-consent-text">
              Acepto que mi correo se utilice con fines comerciales y de comunicación, conforme al
              <a href="aviso-correo-dojo.html" target="_blank" rel="noopener">aviso sobre el uso del correo</a>.
            </span>
          </label>
        </div>
        <button type="submit" class="btn-submit-post">Unirse a la práctica</button>
      </form>
      <p class="dojo-footer-link">
        <a href="baja-dojo.html">Darte de baja de los avisos por correo</a>
      </p>
    </div>
  </header>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-logo">
        <span class="footer-symbol"><img src="enso.png" alt="Ensō" class="enso-img" /></span>
        <span class="footer-name">El Manuscrito Zen</span>
      </div>
      <p class="footer-phrase">"Respira. Estás aquí."</p>
      <p class="footer-copy">© 2026 El Manuscrito Zen · Hecho con presencia</p>
    </div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="comments-config.js"></script>
  <script src="navbar.js"></script>
  <script>
    const DOJO_MAKE_WEBHOOK = 'https://hook.eu1.make.com/0wvxlr955g74hugigubcbvff5le1xq32';
    const DOJO_MAKE_WEBHOOK_TOKEN = 'emz-dojo-wh-7f3k9m2p4x8q1n6';

    function initDojoFirebase() {
      if (!firebase.apps.length) {
        firebase.initializeApp({
          apiKey: COMMENTS_FIREBASE.apiKey,
          authDomain: COMMENTS_FIREBASE.authDomain,
          projectId: COMMENTS_FIREBASE.projectId,
          storageBucket: COMMENTS_FIREBASE.storageBucket,
          messagingSenderId: COMMENTS_FIREBASE.messagingSenderId,
          appId: COMMENTS_FIREBASE.appId,
        });
      }
    }

    function mapDojoError(error) {
      const code = error?.code || '';
      const map = {
        'auth/email-already-in-use': 'Ese correo ya tiene cuenta. Usa la misma contraseña para volver a unirte.',
        'auth/invalid-email': 'Correo no válido.',
        'auth/weak-password': 'La contraseña debe tener al menos 6 caracteres.',
        'auth/wrong-password': 'Contraseña incorrecta para ese correo.',
        'auth/invalid-credential': 'Correo o contraseña incorrectos. Si te registraste con Google, usa Google en Comentarios.',
        'auth/invalid-login-credentials':
          'Ese correo ya tiene cuenta pero la contraseña no coincide. Usa la contraseña correcta, entra con Google en Comentarios, o prueba con otro correo.',
        'auth/network-request-failed': 'Sin conexión. Inténtalo otra vez.',
        'auth/operation-not-allowed': 'Registro con correo desactivado en Firebase. Avisa al administrador.',
        'auth/too-many-requests': 'Demasiados intentos. Espera unos minutos e inténtalo otra vez.',
        'auth/account-exists-with-different-credential':
          'Ese correo ya está registrado con Google. Entra con Google en Comentarios o usa otro correo.',
        'permission-denied':
          'No se pudo guardar la suscripción. Marca la casilla de consentimiento y vuelve a intentarlo. Si sigue fallando, avisa al administrador.',
      };
      if (map[code]) return map[code];
      if (code) return `No se pudo completar (${code}). Inténtalo más tarde o avisa al administrador.`;
      return 'No se pudo completar el registro. Inténtalo más tarde.';
    }

    async function ensureDojoAuthUser(name, email, password) {
      try {
        const cred = await firebase.auth().createUserWithEmailAndPassword(email, password);
        await cred.user.updateProfile({ displayName: name });
        return cred.user;
      } catch (err) {
        if (err.code !== 'auth/email-already-in-use') throw err;
        try {
          const cred = await firebase.auth().signInWithEmailAndPassword(email, password);
          if (name && cred.user.displayName !== name) {
            await cred.user.updateProfile({ displayName: name });
          }
          return cred.user;
        } catch (signInErr) {
          if (
            signInErr.code === 'auth/invalid-credential' ||
            signInErr.code === 'auth/invalid-login-credentials' ||
            signInErr.code === 'auth/wrong-password'
          ) {
            const conflict = new Error(
              'Ese correo ya tiene cuenta (quizá con Google). Usa la contraseña correcta o entra con Google en Comentarios.'
            );
            conflict.code = 'auth/account-exists-with-different-credential';
            throw conflict;
          }
          throw signInErr;
        }
      }
    }

    const form = document.getElementById('dojo-enroll-form');
    const submitBtn = form.querySelector('button[type="submit"]');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = form.name.value.trim();
      const email = form.email.value.trim().toLowerCase();
      const password = form.password.value;
      const marketingConsent = document.getElementById('dojo-marketing-consent').checked;
      if (!name || !email || !password) return;
      if (!marketingConsent) {
        alert('Debes marcar la casilla de consentimiento sobre el uso de tu correo.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Enviando…';

      try {
        initDojoFirebase();
        await ensureDojoAuthUser(name, email, password);
        await firebase.firestore().collection('dojo_subscribers').add({
          name,
          email,
          active: true,
          marketingConsent: true,
          consentAt: firebase.firestore.FieldValue.serverTimestamp(),
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
        fetch(DOJO_MAKE_WEBHOOK, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, token: DOJO_MAKE_WEBHOOK_TOKEN }),
        }).catch((err) => console.warn('Dojo email webhook:', err));
        alert('¡Bienvenido al Dojo! Revisa tu correo en unos minutos. Ya puedes comentar en las entradas con el mismo correo y contraseña.');
        form.reset();
      } catch (error) {
        console.error('Dojo subscribe:', error.code || error.message || error);
        alert(mapDojoError(error));
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Unirse a la práctica';
      }
    });
  </script>
</body>
</html>
